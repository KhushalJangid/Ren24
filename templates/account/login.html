{% extends "base_auth.html" %}
{% block title %}Login{% endblock title %}
{% block body %}
    <div class="container">
        <div class="d-flex justify-content-center h-100">
            <div class="card-small">
                <div class="card-header">
                    <h3>Log In</h3>
                </div>
                <div class="card-body">
                    <form action="{% url 'login' %}" method="post">
                        {% csrf_token %}
                        <span class="text-danger">*Email is case sensitive</span>
                        <div class="input-group form-group">
                            <div class="input-group-prepend">
                                <span class="input-group-text">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-envelope" viewBox="0 0 16 16">
                                        <path d="M0 4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2zm2-1a1 1 0 0 0-1 1v.217l7 4.2 7-4.2V4a1 1 0 0 0-1-1zm13 2.383-4.708 2.825L15 11.105zm-.034 6.876-5.64-3.471L8 9.583l-1.326-.795-5.64 3.47A1 1 0 0 0 2 13h12a1 1 0 0 0 .966-.741M1 11.105l4.708-2.897L1 5.383z"/>
                                      </svg>
                                </span>
                            </div>
                            <input type="email" name="email" class="form-control" placeholder="Email Address" required>
                        </div>
                        <div class="input-group form-group">
                            <div class="input-group-prepend">
                                <span class="input-group-text">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-key" viewBox="0 0 16 16">
                                        <path d="M0 8a4 4 0 0 1 7.465-2H14a.5.5 0 0 1 .354.146l1.5 1.5a.5.5 0 0 1 0 .708l-1.5 1.5a.5.5 0 0 1-.708 0L13 9.207l-.646.647a.5.5 0 0 1-.708 0L11 9.207l-.646.647a.5.5 0 0 1-.708 0L9 9.207l-.646.647A.5.5 0 0 1 8 10h-.535A4 4 0 0 1 0 8m4-3a3 3 0 1 0 2.712 4.285A.5.5 0 0 1 7.163 9h.63l.853-.854a.5.5 0 0 1 .708 0l.646.647.646-.647a.5.5 0 0 1 .708 0l.646.647.646-.647a.5.5 0 0 1 .708 0l.646.647.793-.793-1-1h-6.63a.5.5 0 0 1-.451-.285A3 3 0 0 0 4 5"/>
                                        <path d="M4 8a1 1 0 1 1-2 0 1 1 0 0 1 2 0"/>
                                      </svg>
                                </span>
                            </div>
                            <input type="password" id="password" name="pass1" class="form-control" placeholder="Password" required>
                        </div>
                        <div class="my-2">
                            <input type="checkbox" name="show" value="" onClick="showPass(this)" id="show-btn">
                            <label for="show-btn" class="cursor-pointer text-light">Show password</label>
                        </div>
                        <div class="g-recaptcha" data-sitekey="6LdDA5cpAAAAAOBABUcWKjvew2u4Jpys6KCzju7c"></div>
                        <br >
                        <div class="form-group">
                            <input type="submit" value="Login" class="btn float-right login_btn">
                        </div>
                    </form>
                </div>
                <div class="card-footer">
                    <div class="d-flex justify-content-center links">
                        Don't have an account?<a href="{% url "register" %}">Sign Up</a>
                    </div>
                    <div class="d-flex justify-content-center">
                        <a href="{% url "forgotpassword" %}">Forgot your password?</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        const form = document.querySelector('form');
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const captchaResponse = grecaptcha.getResponse();
            if (!captchaResponse.length > 0) {
                throw new Error("Captcha not complete");
            }
            form.submit();
        });
    </script>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    {% endblock body %}
